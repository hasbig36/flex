# Builds the Flex Android app (phones and Android TV) and publishes it as the
# "android-latest" release: https://github.com/<owner>/<repo>/releases/download/android-latest/flex.apk
#
# Signing: add these repository secrets so every build is signed with the same key
# (required for customers to get updates without uninstalling):
#   FLEX_KEYSTORE_B64        base64 of the .jks keystore
#   FLEX_KEYSTORE_PASSWORD   keystore (and key) password
#   FLEX_KEY_ALIAS           key alias (default: flex)
# Without them the APK is signed with a temporary debug key.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      flexUrl:
        description: 'Address the app opens'
        default: 'https://tv.savenet.co.ke/'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Signing key
        env:
          KS: ${{ secrets.FLEX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/flex.jks"
            echo "FLEX_KEYSTORE=$RUNNER_TEMP/flex.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No FLEX_KEYSTORE_B64 secret: signing with a temporary debug key."
          fi

      - name: Build
        env:
          FLEX_KEYSTORE_PASSWORD: ${{ secrets.FLEX_KEYSTORE_PASSWORD }}
          FLEX_KEY_ALIAS: ${{ secrets.FLEX_KEY_ALIAS }}
          FLEX_VERSION_CODE: ${{ github.run_number }}
          FLEX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          URL="${{ inputs.flexUrl }}"
          gradle -p android --no-daemon assembleRelease ${URL:+-PflexUrl=$URL}
          cp android/app/build/outputs/apk/release/app-release.apk flex.apk
          ls -l flex.apk

      - uses: actions/upload-artifact@v4
        with: { name: flex-apk, path: flex.apk }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Flex Android app (latest)
          body: |
            Flex for Android phones and Android TV, build 1.0.${{ github.run_number }}.
            Put flex.apk in /opt/flex/apps/ on the server, and customers can download it from "My plan" > "Get the app".
          files: flex.apk
          make_latest: false
