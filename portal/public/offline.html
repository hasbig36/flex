<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F4EE;color:#221D18;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.c{max-width:420px;padding:32px;border-radius:24px;background:rgba(255,255,255,.8);box-shadow:0 12px 34px rgba(92,62,32,.12);text-align:center}
.m{width:56px;height:56px;border-radius:16px;background:#E8A33D;display:grid;place-items:center;margin:0 auto 18px}
.m:before{content:"";border-left:17px solid #1B1205;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:#5A4F45}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:999px;padding:12px 26px;background:#E8A33D;color:#1B1205;cursor:pointer}
button:focus-visible{outline:3px solid #9A5F12;outline-offset:3px}</style></head>
<body><div class="c"><div class="m"></div><h1>You're offline</h1><p>Check your internet connection, then try again.</p>
<button onclick="location.reload()" autofocus>Try again</button></div></body></html>
